[package]
name = "cargo-wrapper-dependency-audit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dependency build-time capability review plugin for Cargo Wrapper"
repository = "https://github.com/danielemiliogarcia/cargo-wrapper-dependency-audit"

[[bin]]
name = "cargo-wrapper-plugin-dependency-audit"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3.20"

# The profile used for reproducible release artifacts generated by dist.
[profile.dist]
inherits = "release"
lto = "thin"
