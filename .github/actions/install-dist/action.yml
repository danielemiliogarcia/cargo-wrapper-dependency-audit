# Bootstraps the exact release orchestrator used by the release workflow.
# Every platform archive is version-pinned and SHA-256 verified before execution.

name: Install pinned dist
description: Install the release orchestrator from a checksum-pinned upstream archive

runs:
  using: composite
  steps:
    - name: Install dist on Linux or macOS
      if: runner.os != 'Windows'
      shell: bash
      env:
        DIST_VERSION: "0.32.0"
      run: |
        set -euo pipefail

        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)
            target="x86_64-unknown-linux-gnu"
            expected="eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946"
            ;;
          Linux/ARM64)
            target="aarch64-unknown-linux-gnu"
            expected="d29bcffeb3f8b0c517b4ce0dd2470926ed5cb0bb29d78c6bdd5f88d76ee14a6a"
            ;;
          macOS/X64)
            target="x86_64-apple-darwin"
            expected="6243464a8389e006b9256ee548bc795638f1a17113c1b6669c0e05ce89fd05c5"
            ;;
          macOS/ARM64)
            target="aarch64-apple-darwin"
            expected="aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7"
            ;;
          *)
            echo "unsupported dist host: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        archive="cargo-dist-${target}.tar.xz"
        url="https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${archive}"
        work_dir="${RUNNER_TEMP}/install-dist"
        mkdir -p "${work_dir}" "${HOME}/.cargo/bin"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
          "${url}" --output "${work_dir}/${archive}"

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${work_dir}/${archive}" | cut -d ' ' -f 1)"
        else
          actual="$(shasum -a 256 "${work_dir}/${archive}" | cut -d ' ' -f 1)"
        fi
        if [[ "${actual}" != "${expected}" ]]; then
          echo "dist archive checksum mismatch" >&2
          exit 1
        fi

        tar -xJf "${work_dir}/${archive}" -C "${work_dir}"
        dist_binary="$(find "${work_dir}" -type f -name dist -print -quit)"
        if [[ -z "${dist_binary}" ]]; then
          echo "dist executable is missing from its archive" >&2
          exit 1
        fi
        install -m 0755 "${dist_binary}" "${HOME}/.cargo/bin/dist"
        echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
        "${HOME}/.cargo/bin/dist" --version

    - name: Install dist on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        DIST_VERSION: "0.32.0"
        DIST_SHA256: "26e845cabff12a92911ce960af73a86c8f9b2b2d9072b01dfe5b662acf044fa3"
      run: |
        $ErrorActionPreference = "Stop"
        if ($env:RUNNER_ARCH -ne "X64") {
          throw "unsupported dist host: Windows/$env:RUNNER_ARCH"
        }

        $archive = "cargo-dist-x86_64-pc-windows-msvc.zip"
        $url = "https://github.com/axodotdev/cargo-dist/releases/download/v$env:DIST_VERSION/$archive"
        $workDir = Join-Path $env:RUNNER_TEMP "install-dist"
        $archivePath = Join-Path $workDir $archive
        New-Item -ItemType Directory -Force $workDir | Out-Null
        Invoke-WebRequest -Uri $url -OutFile $archivePath

        $actual = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
        if ($actual -ne $env:DIST_SHA256) {
          throw "dist archive checksum mismatch"
        }

        Expand-Archive -Path $archivePath -DestinationPath $workDir -Force
        $distBinary = Get-ChildItem -Path $workDir -Filter "dist.exe" -Recurse |
          Select-Object -First 1
        if ($null -eq $distBinary) {
          throw "dist executable is missing from its archive"
        }

        $binDir = Join-Path $HOME ".cargo\bin"
        New-Item -ItemType Directory -Force $binDir | Out-Null
        Copy-Item -Force $distBinary.FullName (Join-Path $binDir "dist.exe")
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $binDir "dist.exe") --version
