# Defines the plugin release target matrix and provenance policy.
# `dist` consumes this file locally and when orchestrating GitHub releases.

[workspace]
members = ["cargo:."]

# Release automation is generated and orchestrated by dist.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
allow-dirty = ["ci"]
installers = []
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

install-updater = false

# Attest the complete release set, including archives and checksum files.
github-attestations = true
github-attestations-phase = "host"
github-attestations-filters = ["*"]
github-release = "host"

# Pin every third-party action used by the generated workflow.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest-build-provenance" = "4d101475d8b20a2381f78447822ac1eab6504dd8" # v4.2.2
